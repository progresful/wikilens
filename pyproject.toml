[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikilens"
version = "0.1.0"
description = "Scrub a Wikipedia article's answer through time, on MariaDB system-versioned tables"
requires-python = ">=3.11"
dependencies = [
  "pymysql>=1.1",
  "pyarrow>=18",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff", "mypy", "types-PyMySQL"]

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["wikilens"]

[tool.setuptools.package-data]
wikilens = ["*.sql", "*.tsv", "*.json"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--cov=wikilens --cov-report=term-missing"
