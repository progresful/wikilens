# /etc/nginx/sites-available/wikilens  ->  https://wikilens.pgf.lv
# The page is static files; /api/ goes to the WikiLens API on 127.0.0.1; /film/ is the film.
# certbot adds the HTTPS half to this file when it is first run.

# Asking a question runs an embedding model on this machine: a few a minute per visitor is plenty.
limit_req_zone $binary_remote_addr zone=wikilens_ask:10m rate=20r/m;
# Scrubbing the timeline sends one small query per frame, so this one is generous.
limit_req_zone $binary_remote_addr zone=wikilens_api:10m rate=80r/s;

upstream wikilens_api {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wikilens.pgf.lv;

    root /srv/apps/wikilens/web/dist;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # The page loads nothing from anywhere else and may not be framed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # How requests are handed to the API. Kept in this one file: a site that includes a file from an
    # app's own folder can be broken, for every site on the machine, by whoever edits that folder.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Errors made here are said in the shape the page reads, so it can show them in plain words.
    limit_req_status 429;
    error_page 429 = @busy;
    error_page 502 504 = @down;
    location @busy {
        default_type application/json;
        return 429 '{"success":false,"data":null,"error":"too many requests: wait a few seconds","meta":null}';
    }
    location @down {
        default_type application/json;
        return 503 '{"success":false,"data":null,"error":"the server is restarting: try again in a moment","meta":null}';
    }

    location ~ ^/api/articles/[0-9]+/ask$ {
        limit_req zone=wikilens_ask burst=8 nodelay;
        proxy_pass http://wikilens_api;
    }

    # The health check asks the model for an embedding, so it is rationed like a question.
    location = /api/health {
        limit_req zone=wikilens_ask burst=8 nodelay;
        proxy_pass http://wikilens_api;
    }

    location /api/ {
        limit_req zone=wikilens_api burst=160 nodelay;
        proxy_pass http://wikilens_api;
    }

    # Built files carry a hash in their names, so they can be kept for a long time.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location /film/ {
        alias /srv/apps/wikilens/film/;
        index index.html;
        expires 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
