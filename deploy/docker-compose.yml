# WikiLens on a server: MariaDB and the embedding model. The API itself runs under systemd
# (deploy/wikilens.service), and nginx serves the page (deploy/nginx-wikilens.conf).
#   docker compose --project-directory /srv/apps/wikilens -f deploy/docker-compose.yml up -d
# Both are published on 127.0.0.1 only: Docker bypasses the host firewall, so nothing here may
# listen on a public address. Credentials come from /srv/apps/wikilens/.env.
name: wikilens

services:
  mariadb:
    # The same image as docker-compose.yml, so a copied data volume opens unchanged.
    image: mariadb@sha256:4ebbcf100a3ba320766dfa0e1af008df12261301db6ef72798c7650f70794aed
    environment:
      MARIADB_ROOT_PASSWORD: ${WIKILENS_DB_ROOT_PASSWORD:?set WIKILENS_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${WIKILENS_DB_NAME:-wikilens}
      MARIADB_USER: ${WIKILENS_DB_USER:?set WIKILENS_DB_USER in .env}
      MARIADB_PASSWORD: ${WIKILENS_DB_PASSWORD:?set WIKILENS_DB_PASSWORD in .env}
    # A small shared machine: a modest buffer pool. The whole database is 1.3 GB; frames stay fast
    # because each reads a few hundred rows by primary key.
    command: ["--max-allowed-packet=64M", "--innodb-buffer-pool-size=640M", "--max-connections=60"]
    ports:
      - "127.0.0.1:${WIKILENS_DB_PORT:?set WIKILENS_DB_PORT in .env}:3306"
    volumes:
      - wikilens-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  ollama:
    # ollama/ollama:latest as pulled on 14 Nov 2026, pinned so the model server cannot drift
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      # The model answers one question at a time and leaves memory when nobody has asked for a while.
      OLLAMA_KEEP_ALIVE: 20m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:${WIKILENS_OLLAMA_PORT:?set WIKILENS_OLLAMA_PORT in .env}:11434"
    volumes:
      - wikilens-ollama:/root/.ollama
    restart: unless-stopped

volumes:
  wikilens-data:
  wikilens-ollama:
